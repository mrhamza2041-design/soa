version: '3.9'

services:

  # SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver2022
    environment:
      SA_PASSWORD: "MyS3cureP@ssw0rd"  # Must meet SQL Server password policy
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD-SHELL", "pidof sqlservr"]
      interval: 10s
      timeout: 5s
      retries: 10

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # NotificationService
  notificationservice:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    ports:
      - "5002:8080"  # Expose NotificationService API
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=NotificationDb;User Id=sa;Password=MyS3cureP@ssw0rd;TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    networks:
      - mynetwork

  # OrderService
  orderservice:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    ports:
      - "5000:8080"  # Expose OrderService API
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=MyS3cureP@ssw0rd;TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    networks:
      - mynetwork

  # InventoryService
  inventoryservice:
    build:
      context: .
      dockerfile: InventoryService/Dockerfile
    ports:
      - "5001:8080"  # Expose InventoryService API
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=InventoryDb;User Id=sa;Password=MyS3cureP@ssw0rd;TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    networks:
      - mynetwork

    #frontend
  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile 
      container_name: fe-frontend
      ports:
        - "3000:3000"
      depends_on:
        - orderservice
        - inventoryservice
        - notificationservice
        - sqlserver
        - rabbitmq
      environment:
        NODE_ENV: production
      networks:
        - mynetwork



networks:
  mynetwork:
    driver: bridge
